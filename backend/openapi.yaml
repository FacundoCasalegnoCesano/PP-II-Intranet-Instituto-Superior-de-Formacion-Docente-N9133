      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InscripcionCarreraRequest' }
      responses:
        '201': { $ref: '#/components/responses/Created' }

  /inscripciones-carreras/{id}:
    delete:
      tags: [Inscripciones a Carreras]
      summary: Dar de baja inscripción a carrera (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OK' }

  /inscripciones-carreras/alumno/{alumnoId}:
    get:
      tags: [Inscripciones a Carreras]
      description: "El parámetro `alumnoId` es `Usuario.idUsuario` (ID de cuenta), no `Alumno.idAlumno`. Un ALUMNO solo puede consultar su propio ID; ADMINISTRATIVO puede consultar cualquier cuenta."
      summary: Carreras de un alumno
      x-roles: [ALUMNO, ADMINISTRATIVO]
      parameters:
        - { name: alumnoId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Inscripciones de carrera
          content: { application/json: { schema: { $ref: '#/components/schemas/InscripcionesCarreraResponse' } } }

  /inscripciones-carreras/carrera/{carreraId}/inscriptos:
    get:
      tags: [Inscripciones a Carreras]
      summary: Inscriptos de una carrera (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: carreraId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OK' }

  # ========================= INSCRIPCIONES A MATERIAS =========================
  /inscripciones-materias/disponibles:
    get:
      tags: [Inscripciones a Materias]
      description: "Para ALUMNO la identidad se deriva del JWT; ADMINISTRATIVO debe enviar `alumnoId` como `Usuario.idUsuario`. No incluye horarios estructurados: la disponibilidad académica no sustituye el horario PDF publicado."
      summary: "Materias disponibles para inscribirse (alumno usa su ID; admin usa ?alumnoId=)"
      x-roles: [ALUMNO, ADMINISTRATIVO]
      parameters:
        - { name: alumnoId, in: query, schema: { type: integer }, description: Requerido si eres ADMINISTRATIVO }
        - { name: cicloLectivo, in: query, schema: { type: integer }, description: Por defecto el año actual }
      responses:
        '200':
          description: Materias y condiciones calculadas por el backend
          content: { application/json: { schema: { $ref: '#/components/schemas/MateriasDisponiblesResponse' } } }

  /inscripciones-materias/verificar/{materiaId}:
    get:
      tags: [Inscripciones a Materias]
      description: "Para ALUMNO se usa el JWT; ADMINISTRATIVO indica `alumnoId` como `Usuario.idUsuario`. Es una vista previa; el alta vuelve a verificar período y correlatividades."
      summary: Verificar si el alumno puede inscribirse a una materia
      x-roles: [ALUMNO, ADMINISTRATIVO]
      parameters:
        - { name: materiaId, in: path, required: true, schema: { type: integer } }
        - { name: alumnoId, in: query, schema: { type: integer }, description: Requerido si eres ADMINISTRATIVO }
        - { name: cicloLectivo, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Resultado de la verificación académica
          content: { application/json: { schema: { $ref: '#/components/schemas/VerificacionInscripcionMateriaResponse' } } }

  /inscripciones-materias:
    post:
      tags: [Inscripciones a Materias]
      description: "ALUMNO omite `alumnoId`: el backend deriva `Usuario.idUsuario` del JWT y revalida período y correlatividades. ADMINISTRATIVO puede indicar `alumnoId` (ID de cuenta)."
      summary: Inscribir alumno a materia (alumno = él mismo, admin indica alumnoId)
      x-roles: [ALUMNO, ADMINISTRATIVO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InscripcionMateriaRequest' }
      responses:
        '201':
          description: Inscripción a materia creada o reactivada
          content: { application/json: { schema: { $ref: '#/components/schemas/InscripcionMateriaMutationResponse' } } }

  /inscripciones-materias/{id}:
    delete:
      tags: [Inscripciones a Materias]
      description: "ALUMNO puede dar de baja únicamente una inscripción propia; ADMINISTRATIVO puede actuar sobre cualquier inscripción. No recibe `alumnoId` en el cuerpo."
      summary: Dar de baja inscripción a materia
      x-roles: [ALUMNO, ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Inscripción a materia dada de baja
          content: { application/json: { schema: { $ref: '#/components/schemas/InscripcionMateriaMutationResponse' } } }

  /inscripciones-materias/alumno/{alumnoId}:
    get:
      tags: [Inscripciones a Materias]
      description: "`alumnoId` es `Usuario.idUsuario`, no `Alumno.idAlumno`; ALUMNO solo accede a su propio ID."
      summary: Materias de un alumno
      x-roles: [ALUMNO, ADMINISTRATIVO]
      parameters:
        - { name: alumnoId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Inscripciones activas paginadas
          content: { application/json: { schema: { $ref: '#/components/schemas/InscripcionesMateriaResponse' } } }

  /inscripciones-materias/materia/{materiaId}/inscriptos:
    get:
      tags: [Inscripciones a Materias]
      summary: Inscriptos de una materia (admin o profesor)
      x-roles: [ADMINISTRATIVO, PROFESOR]
      parameters:
        - { name: materiaId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OK' }

  /inscripciones-materias/historial/{alumnoId}/{materiaId}:
    get:
      tags: [Inscripciones a Materias]
      description: "`alumnoId` es `Usuario.idUsuario`; ALUMNO solo puede consultar su propio historial."
      summary: Historial de un alumno en una materia
      x-roles: [ALUMNO, ADMINISTRATIVO]
      parameters:
        - { name: alumnoId, in: path, required: true, schema: { type: integer } }
        - { name: materiaId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Historial de inscripciones para la materia
          content: { application/json: { schema: { $ref: '#/components/schemas/HistorialInscripcionMateriaResponse' } } }

  /inscripciones-materias/{id}/modalidad:
    put:
      tags: [Inscripciones a Materias]
      summary: Cambiar modalidad de cursada (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CambiarModalidadRequest' }
      responses:
        '200': { $ref: '#/components/responses/OK' }

  # ========================= EXÁMENES =========================
  /examenes:
    get:
      tags: [Exámenes]
      summary: Listar exámenes (admin o tribunal del profesor)
      description: El profesor solo recibe mesas en cuyos tribunales participa.
      x-roles: [ADMINISTRATIVO, PROFESOR]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
        - { name: materiaId, in: query, schema: { type: integer } }
        - { name: fechaDesde, in: query, schema: { type: string, format: date } }
        - { name: fechaHasta, in: query, schema: { type: string, format: date } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedOK' }
    post:
      tags: [Exámenes]
      summary: Crear examen (solo admin)
      x-roles: [ADMINISTRATIVO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamenCreateRequest' }
      responses:
        '201': { $ref: '#/components/responses/Created' }

  /examenes/disponibles:
    get:
      tags: [Exámenes]
      summary: Listar mesas disponibles para el alumno autenticado
      description: Devuelve mesas futuras, activas y abiertas, incluidas en un período EXAMEN vigente, pertenecientes a una carrera activa del alumno y para las que cumple condición académica y correlatividades. La fecha conserva hora porque representa el momento del examen final.
      x-roles: [ALUMNO]
      responses:
        '200':
          description: Mesas habilitadas para inscripción autónoma
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MesaDisponibleAlumno' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /examenes/{id}:
    get:
      tags: [Exámenes]
      summary: Obtener examen por ID (profesor solo si integra tribunal)
      x-roles: [ADMINISTRATIVO, PROFESOR, ALUMNO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OK' }
    put:
      tags: [Exámenes]
      summary: Actualizar examen (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamenUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/OK' }
    delete:
      tags: [Exámenes]
      summary: Eliminar examen (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OK' }

  /examenes/tribunales:
    post:
      tags: [Exámenes]
      summary: Agregar tribunal a un examen (solo admin)
      x-roles: [ADMINISTRATIVO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TribunalRequest' }
      responses:
        '201': { $ref: '#/components/responses/Created' }

  /examenes/tribunales/{id}:
    delete:
      tags: [Exámenes]
      summary: Quitar tribunal de un examen (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OK' }

  /examenes/{examenId}/inscribir:
    post:
      tags: [Exámenes]
      description: "ALUMNO omite `alumnoId`: el backend deriva la identidad del JWT y vuelve a validar período, fecha de corte, condición y correlatividades. ADMINISTRATIVO puede indicar `alumnoId` como `Usuario.idUsuario`."
      summary: Inscribir alumno a un examen (alumno usa su propio ID)
      x-roles: [ALUMNO, ADMINISTRATIVO]
      parameters:
        - { name: examenId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InscripcionExamenRequest' }
      responses:
        '201':
          description: Inscripción a mesa creada o reactivada
          content: { application/json: { schema: { $ref: '#/components/schemas/InscripcionExamenMutationResponse' } } }

  /examenes/{examenId}/desinscribir:
    post:
      tags: [Exámenes]
      description: "ALUMNO omite `alumnoId` y solo puede darse de baja a sí mismo; ADMINISTRATIVO puede indicar `alumnoId` como `Usuario.idUsuario`."
      summary: Desinscribir alumno de un examen
      x-roles: [ALUMNO, ADMINISTRATIVO]
      parameters:
        - { name: examenId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DesinscripcionExamenRequest' }
      responses:
        '200':
          description: Inscripción a mesa dada de baja
          content: { application/json: { schema: { $ref: '#/components/schemas/InscripcionExamenMutationResponse' } } }

  /examenes/{examenId}/inscriptos:
    get:
      tags: [Exámenes]
      summary: Inscriptos de una mesa autorizada
      x-roles: [ADMINISTRATIVO, PROFESOR]
      parameters:
        - { name: examenId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OK' }

  /examenes/alumno/{alumnoId}/inscripciones:
    get:
      tags: [Exámenes]
      description: "`alumnoId` es `Usuario.idUsuario`, no `Alumno.idAlumno`; ALUMNO solo puede consultar su propio ID."
      summary: Inscripciones a exámenes de un alumno
      x-roles: [ALUMNO, ADMINISTRATIVO]
      parameters:
        - { name: alumnoId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Inscripciones activas a mesas
          content: { application/json: { schema: { $ref: '#/components/schemas/InscripcionesExamenResponse' } } }

  /examenes/{examenId}/calificacion:
    post:
      tags: [Exámenes]
      summary: Registrar nota a un alumno en un examen (admin o integrante del tribunal)
      description: Un profesor solo puede registrar la nota si forma parte del tribunal de la mesa.
      x-roles: [ADMINISTRATIVO, PROFESOR]
      parameters:
        - { name: examenId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalificacionRequest' }
      responses:
        '200': { $ref: '#/components/responses/OK' }

