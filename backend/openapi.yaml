openapi: 3.0.3
info:
  title: Instituto Académico — Intranet API
  description: |
    Backend Express + TypeScript + Prisma (MariaDB) para gestión académica.
    ### Autenticación
    - `POST /auth/login` devuelve un **accessToken sin rol**.
    - `POST /auth/select-role` (con ese token) devuelve un **accessToken con rol**.
    - Todas las demás rutas protegen el acceso por rol del token.
    - Envío del token: cabecera `Authorization: Bearer <token>`.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Local

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Usuarios
  - name: Alumnos
  - name: Profesores
  - name: Administrativos
  - name: Carreras
  - name: Materias
  - name: Cursadas
  - name: Inscripciones a Carreras
  - name: Inscripciones a Materias
  - name: Exámenes
  - name: Horarios
  - name: Horarios Publicados
  - name: Libro de Temas
  - name: Períodos de Inscripción
  - name: Asistencias
  - name: Calificaciones
  - name: Estado Academico
  - name: Homologaciones
  - name: Health

paths:
  # ========================= AUTH =========================
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión (email o DNI)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login exitoso. Devuelve accessToken sin rol y refreshToken.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/select-role:
    post:
      tags: [Auth]
      summary: Seleccionar rol de la sesión (devuelve accessToken con rol)
      operationId: selectRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SelectRoleRequest' }
      responses:
        '200':
          description: Token con rol seleccionado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelectRoleResponse' }
        '403': { $ref: '#/components/responses/RoleRequired' }

  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar un nuevo usuario (solo ADMINISTRATIVO)
      x-roles: [ADMINISTRATIVO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Perfil del usuario autenticado
      responses:
        '200':
          description: Perfil del usuario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión actual
      responses:
        '200':
          description: Sesión cerrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }

  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: Renovar token con refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshTokenResponse' }

  /auth/change-password:
    put:
      tags: [Auth]
      summary: Cambiar contraseña propia y revocar las demás sesiones de su familia
      x-roles: [ALUMNO, PROFESOR, ADMINISTRATIVO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangePasswordResponse' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Solicitar reset de contraseña (envía un token de un solo uso por email)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '200':
          description: Solicitud procesada. La respuesta no revela si el email existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Restablecer contraseña con el token de un solo uso del email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: Contraseña reseteada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/verify-reset-token/{token}:
    get:
      tags: [Auth]
      summary: Verificar validez de un token de recuperación no utilizado
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Token válido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyResetTokenResponse' }

  # ========================= USUARIOS =========================
  /users:
    get:
      tags: [Usuarios]
      summary: Listar usuarios (paginado + filtros)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 100 } }
        - { name: rol, in: query, schema: { type: string, enum: [ALUMNO, ADMINISTRATIVO, PROFESOR] } }
        - { name: activo, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200':
          description: Lista paginada de usuarios
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedResponse' }

  /users/{id}:
    get:
      tags: [Usuarios]
      summary: Obtener usuario por ID (admin o el mismo usuario)
      x-roles: [ADMINISTRATIVO, ALUMNO, PROFESOR]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Usuarios]
      summary: Actualizar usuario (admin o el mismo usuario)
      x-roles: [ADMINISTRATIVO, ALUMNO, PROFESOR]
      description: "Los usuarios no administrativos solo pueden editar su propio perfil mediante la allowlist `apellidoNombre`, `dni`, `email`, `fechaNacimiento`, `telefono`, `cuil`, `contactoEmergencia` y `foto`. Los campos `rol`, `activo`, `password`, `passwordHash` y `backupCodes` se rechazan; la contraseña se cambia mediante `/auth/change-password`. Los administradores pueden usar los campos administrativos de `UserUpdateRequest`."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/OwnProfileUpdateRequest'
                - $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserResponse' }
    delete:
      tags: [Usuarios]
      summary: Aplicar baja lógica a un usuario (solo admin)
      description: "Conserva la cuenta y el historial académico, marca `activo=false` y revoca sus sesiones."
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Usuario desactivado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }

  /users/{id}/role:
    put:
      tags: [Usuarios]
      summary: Cambiar rol de un usuario (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeRoleRequest' }
      responses:
        '200':
          description: Rol actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserResponse' }

  /users/{id}/role/{rol}:
    delete:
      tags: [Usuarios]
      summary: Quitar un rol de un usuario (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: rol, in: path, required: true, schema: { type: string, enum: [ALUMNO, ADMINISTRATIVO, PROFESOR] } }
      responses:
        '200':
          description: Rol eliminado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserResponse' }

  /users/{id}/activate:
    put:
      tags: [Usuarios]
      summary: Activar/desactivar un usuario (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Estado de activación actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }

  # ========================= ALUMNOS =========================
  /alumnos:
    get:
      tags: [Alumnos]
      summary: Listar alumnos (admin o alumnos de cursadas del profesor)
      description: El profesor solo ve estudiantes con inscripción activa en alguna cursada o materia que le pertenece.
      x-roles: [ADMINISTRATIVO, PROFESOR]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 100 } }
        - { name: activo, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/ListOK' }
    post:
      tags: [Alumnos]
      summary: Crear alumno (solo admin). Usa body de registro con rol ALUMNO forzado.
      operationId: crearAlumno
      x-roles: [ADMINISTRATIVO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/Created' }

  /alumnos/estadisticas:
    get:
      tags: [Alumnos]
      summary: Estadísticas de alumnos (solo admin)
      x-roles: [ADMINISTRATIVO]
      responses:
        '200': { $ref: '#/components/responses/OK' }

  /alumnos/{id}:
    get:
      tags: [Alumnos]
      summary: Obtener alumno (admin, alumno propio o profesor autorizado)
      description: El profesor solo puede consultar estudiantes con inscripción activa en una cursada o materia propia; los no autorizados se presentan como no disponibles.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Alumnos]
      summary: Actualizar alumno (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/OK' }
    delete:
      tags: [Alumnos]
      summary: Eliminar alumno (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OK' }

  # ========================= PROFESORES =========================
  /profesores:
    get:
      tags: [Profesores]
      summary: Listar profesores (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 100 } }
        - { name: activo, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/ListOK' }
    post:
      tags: [Profesores]
      summary: Crear profesor (solo admin). Usa body de registro con rol PROFESOR forzado.
      operationId: crearProfesor
      x-roles: [ADMINISTRATIVO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/Created' }

  /profesores/estadisticas:
    get:
      tags: [Profesores]
      summary: Estadísticas de profesores (solo admin)
      x-roles: [ADMINISTRATIVO]
      responses:
        '200': { $ref: '#/components/responses/OK' }

  /profesores/{id}:
    get:
      tags: [Profesores]
      summary: Obtener profesor (admin o el mismo profesor)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Profesores]
      summary: Actualizar profesor (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/OK' }
    delete:
      tags: [Profesores]
      summary: Eliminar profesor (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OK' }

  /profesores/{id}/materias:
    get:
      tags: [Profesores]
      summary: Materias asignadas a un profesor (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OK' }

  # ========================= ADMINISTRATIVOS =========================
  /administrativos:
    get:
      tags: [Administrativos]
      summary: Listar administrativos (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 100 } }
        - { name: activo, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/ListOK' }
    post:
      tags: [Administrativos]
      summary: Crear administrativo (solo admin). Body de registro con rol ADMINISTRATIVO forzado.
      operationId: crearAdministrativo
      x-roles: [ADMINISTRATIVO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/Created' }

  /administrativos/estadisticas:
    get:
      tags: [Administrativos]
      summary: Estadísticas de administrativos (solo admin)
      x-roles: [ADMINISTRATIVO]
      responses:
        '200': { $ref: '#/components/responses/OK' }

  /administrativos/{id}:
    get:
      tags: [Administrativos]
      summary: Obtener administrativo (admin o el mismo)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Administrativos]
      summary: Actualizar administrativo (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/OK' }
    delete:
      tags: [Administrativos]
      summary: Eliminar administrativo (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OK' }

  # ========================= CARRERAS =========================
  /carreras:
    get:
      tags: [Carreras]
      summary: Listar carreras (admin o profesor)
      x-roles: [ADMINISTRATIVO, PROFESOR]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 100 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: activo, in: query, schema: { type: boolean } }
      responses:
        '200': { $ref: '#/components/responses/ListOK' }
    post:
      tags: [Carreras]
      summary: Crear carrera (solo admin)
      x-roles: [ADMINISTRATIVO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CarreraCreateRequest' }
      responses:
        '201': { $ref: '#/components/responses/Created' }

  /carreras/catalogo:
    get:
      tags: [Carreras]
      summary: Catálogo de carreras activas para alumnos
      x-roles: [ALUMNO]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/ListOK' }

  /carreras/{id}:
    get:
      tags: [Carreras]
      summary: Obtener carrera por ID
      x-roles: [ADMINISTRATIVO, PROFESOR]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OK' }
    put:
      tags: [Carreras]
      summary: Actualizar carrera (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CarreraUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/OK' }
    delete:
      tags: [Carreras]
      summary: Eliminar carrera (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OK' }

  /carreras/{id}/plan-estudio:
    get:
      tags: [Carreras]
      summary: Plan de estudio de una carrera
      x-roles: [ADMINISTRATIVO, PROFESOR, ALUMNO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OK' }

  # ========================= MATERIAS =========================
  /materias:
    get:
      tags: [Materias]
      summary: Listar materias (admin o materias propias del profesor)
      description: El profesor solo recibe materias con asignación activa o cursada propia.
      x-roles: [ADMINISTRATIVO, PROFESOR]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 100 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: carreraId, in: query, schema: { type: integer } }
        - { name: tipoEspacio, in: query, schema: { $ref: '#/components/schemas/TipoEspacio' } }
        - { name: activo, in: query, schema: { type: boolean } }
      responses:
        '200': { $ref: '#/components/responses/OK' }
    post:
      tags: [Materias]
      summary: Crear materia (solo admin)
      x-roles: [ADMINISTRATIVO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MateriaCreateRequest' }
      responses:
        '201': { $ref: '#/components/responses/Created' }

  /materias/carrera/{carreraId}:
    get:
      tags: [Materias]
      summary: Materias de una carrera
      x-roles: [ADMINISTRATIVO, PROFESOR]
      parameters:
        - { name: carreraId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OK' }

  /materias/{id}:
    get:
      tags: [Materias]
      summary: Obtener materia por ID (profesor solo si es propia)
      x-roles: [ADMINISTRATIVO, PROFESOR]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OK' }
    put:
      tags: [Materias]
      summary: Actualizar materia (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MateriaUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/OK' }
    delete:
      tags: [Materias]
      summary: Eliminar materia (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OK' }

  /materias/{id}/correlatividades:
    get:
      tags: [Materias]
      summary: Correlatividades de una materia
      x-roles: [ADMINISTRATIVO, PROFESOR]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OK' }
    post:
      tags: [Materias]
      summary: Agregar correlatividad a una materia (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
