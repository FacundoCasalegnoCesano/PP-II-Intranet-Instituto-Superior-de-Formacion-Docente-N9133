      responses: { '200': { $ref: '#/components/responses/OK' } }

  # ========================= HORARIOS PUBLICADOS =========================
  /horarios-publicados/anios:
    get:
      tags: [Horarios Publicados]
      summary: Listar ciclos lectivos con un horario PDF vigente
      x-roles: [ALUMNO, PROFESOR, ADMINISTRATIVO]
      responses:
        '200':
          description: Ciclos lectivos publicados en orden descendente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }

  /horarios-publicados/actual:
    get:
      tags: [Horarios Publicados]
      summary: Consultar el horario publicado vigente
      description: "Sin `cicloLectivo`, busca el año actual y luego el último ciclo publicado."
      x-roles: [ALUMNO, PROFESOR, ADMINISTRATIVO]
      parameters:
        - { name: cicloLectivo, in: query, schema: { type: integer, minimum: 2000, maximum: 2100 } }
      responses:
        '200':
          description: Metadatos del horario PDF vigente
          content: { application/json: { schema: { $ref: '#/components/schemas/HorarioPublicadoResponse' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /horarios-publicados/{id}/archivo:
    get:
      tags: [Horarios Publicados]
      summary: Descargar el PDF de un horario
      description: La versión vigente puede ser descargada por cualquier rol; una histórica solo por ADMINISTRATIVO.
      x-roles: [ALUMNO, PROFESOR, ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Archivo PDF binario
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /horarios-publicados:
    post:
      tags: [Horarios Publicados]
      summary: Publicar inmediatamente un PDF de horarios
      x-roles: [ADMINISTRATIVO]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo, cicloLectivo]
              properties:
                archivo: { type: string, format: binary, description: PDF simple de hasta 10 MB }
                cicloLectivo: { type: integer, minimum: 2000, maximum: 2100 }
                titulo: { type: string, maxLength: 160 }
      responses:
        '200':
          description: Se reutilizó y restauró como vigente un PDF idéntico del mismo ciclo lectivo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        '201':
          description: PDF nuevo publicado inmediatamente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /horarios-publicados/historial:
    get:
      tags: [Horarios Publicados]
      summary: Consultar el historial de versiones de un ciclo
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: cicloLectivo, in: query, required: true, schema: { type: integer, minimum: 2000, maximum: 2100 } }
      responses:
        '200':
          description: Historial de metadatos de versiones del PDF
          content: { application/json: { schema: { $ref: '#/components/schemas/HistorialHorarioPublicadoResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /horarios-publicados/{id}/publicar:
    post:
      tags: [Horarios Publicados]
      summary: Restaurar una versión histórica como vigente
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Versión histórica restaurada como vigente
          content: { application/json: { schema: { $ref: '#/components/schemas/HorarioPublicadoMutationResponse' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token JWT con rol (obtenido tras /auth/select-role). Cabecera: Authorization: Bearer <token>"

  responses:
    BadRequest:
      description: Petición inválida (validación Joi)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Token ausente, inválido o expirado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Sin permisos para el rol
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RoleRequired:
      description: El token no tiene rol seleccionado (hacer /auth/select-role)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Demasiadas solicitudes desde el mismo origen
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    OK:
      description: Operación exitosa. Envuelve en { success, message?, data }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessResponse' }
    ListOK:
      description: Lista de usuarios envuelta en { success, data, pagination }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaginatedResponse' }
    PaginatedOK:
      description: Lista paginada { success, data, pagination }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaginatedResponse' }
    Created:
      description: Recurso creado. Envuelve en { success, message, data }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessResponse' }

  schemas:
    # -------- Envoltorios de respuesta --------
    SuccessResponse:
      type: object
      description: "Envelope exitoso. `data` es opcional porque algunas operaciones solo responden `success` y `message`."
      properties:
        success: { type: boolean, example: true }
        message: { type: string, nullable: true, example: Operación exitosa }
        data: { type: object, nullable: true }
      additionalProperties: true
    MessageResponse:
      type: object
      required: [success, message]
      description: "Envelope exitoso sin `data`."
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
    PaginatedResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, nullable: true }
        data: { type: array, items: { type: object } }
        pagination:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        code: { type: string, nullable: true }
        rolesDisponibles: { type: array, items: { type: string }, nullable: true }

    # -------- Auth --------
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, description: Email o DNI }
        password: { type: string, format: password }
      example:
        identifier: admin@instituto.edu.ar
        password: Admin123!
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [success, message, data]
          properties:
            data:
              type: object
              required: [user, roles, accessToken, refreshToken, sessionId]
              properties:
                user: { $ref: '#/components/schemas/PublicUser' }
                roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
                accessToken: { type: string, description: Token JWT sin rol }
                refreshToken: { type: string }
                sessionId: { type: integer }
    SelectRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [ALUMNO, ADMINISTRATIVO, PROFESOR] }
      example:
        role: ADMINISTRATIVO
    SelectRoleResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [success, message, data]
          properties:
            data:
              type: object
              required: [accessToken, refreshToken, sessionId, rol, rolesDisponibles]
              properties:
                accessToken: { type: string, description: Token JWT con rol }
                refreshToken: { type: string }
                sessionId: { type: integer }
                rol: { $ref: '#/components/schemas/Role' }
                rolesDisponibles: { type: array, items: { $ref: '#/components/schemas/Role' } }
    RefreshTokenResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [success, message, data]
          properties:
            data:
              type: object
              required: [accessToken, refreshToken]
              properties:
                accessToken: { type: string, description: Token JWT renovado que conserva el rol activo, si lo tenía. }
                refreshToken: { type: string, description: Refresh token rotado. }
    ProfileResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [success, data]
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PublicUser'
                - type: object
                  required: [roles]
                  properties:
                    roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
    ChangePasswordResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [success, message, data]
          properties:
            data:
              type: object
              required: [message]
              properties:
                message: { type: string, example: Contraseña actualizada exitosamente }
    VerifyResetTokenResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [success, data]
          properties:
            data:
              type: object
              required: [valid]
              properties:
                valid: { type: boolean }
                email: { type: string, format: email, description: Solo se incluye si el token es válido. }
    Role:
      type: string
      enum: [ALUMNO, ADMINISTRATIVO, PROFESOR]
    PublicUser:
      type: object
      description: Usuario público; nunca incluye hashes de contraseñas ni códigos de respaldo.
      required: [idUsuario, apellidoNombre, dni, email, fechaNacimiento, telefono, activo, rol]
      properties:
        idUsuario: { type: integer }
        apellidoNombre: { type: string }
        dni: { type: integer }
        email: { type: string, format: email }
        fechaNacimiento: { type: string, format: date-time }
        telefono: { type: string }
        cuil: { type: string, nullable: true }
        activo: { type: boolean }
        rol: { type: string, description: Lista de roles histórica, separada por comas. }
        contactoEmergencia: { type: string, nullable: true }
        foto: { type: string, nullable: true }
        ultimoAcceso: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AlumnoProfileInput:
      type: object
      additionalProperties: false
      required: [domicilio, anioEgreso]
      properties:
        domicilio: { type: string, maxLength: 255 }
        anioEgreso: { type: integer, minimum: 1900, maximum: 2100 }
        institucionProcedencia: { type: string, nullable: true, maxLength: 255 }
    AlumnoProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        domicilio: { type: string, maxLength: 255 }
        anioEgreso: { type: integer, minimum: 1900, maximum: 2100 }
        institucionProcedencia: { type: string, nullable: true, maxLength: 255 }
    AlumnoProfile:
      allOf:
        - $ref: '#/components/schemas/AlumnoProfileInput'
        - type: object
          required: [idAlumno, idCuenta, adeudaMateria]
          properties:
            idAlumno: { type: integer }
            idCuenta: { type: integer, description: ID público de la cuenta Usuario }
            adeudaMateria: { type: boolean }
    AdminUserDetail:
      allOf:
        - $ref: '#/components/schemas/PublicUser'
        - type: object
          required: [roles, alumno]
          properties:
            roles:
              type: array
              items: { $ref: '#/components/schemas/Role' }
            alumno:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/AlumnoProfile'
    AdminUserResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [success, data]
          properties:
            data: { $ref: '#/components/schemas/AdminUserDetail' }
    RegisterRequest:
      type: object
      required: [apellidoNombre, dni, email, fechaNacimiento, telefono, password, cuil, rol]
      properties:
        apellidoNombre: { type: string, maxLength: 255 }
        dni: { type: string, pattern: '^\\d{7,8}$' }
        email: { type: string, format: email, maxLength: 255 }
        fechaNacimiento: { type: string, format: date, description: No puede ser futura }
        telefono: { type: string, pattern: '^\\d{10,11}$' }
        password: { type: string, format: password, minLength: 8, description: "Requiere mayúscula, minúscula, número y símbolo" }
        cuil: { type: string, pattern: '^\\d{11}$' }
        rol: { type: string, enum: [ALUMNO, ADMINISTRATIVO, PROFESOR] }
        contactoEmergencia: { type: string, nullable: true }
        foto: { type: string, nullable: true }
        domicilio: { type: string, maxLength: 255, description: 'Obligatorio solo si rol = ALUMNO' }
        anioEgreso: { type: integer, minimum: 1990, maximum: 2100, description: 'Año de egreso del secundario. Obligatorio solo si rol = ALUMNO; si se omite usa el año en curso' }
        institucionProcedencia: { type: string, nullable: true, maxLength: 255, description: 'Solo aplica a alumnos' }
      example:
        apellidoNombre: Ana García
        dni: "30123456"
        email: ana.garcia@instituto.edu.ar
        fechaNacimiento: 1998-05-12
        telefono: "1155551234"
        password: Password1!
        cuil: "20301234567"
        rol: ALUMNO
        contactoEmergencia: "1112345678"
        domicilio: Av. Siempre Viva 742
        anioEgreso: 2016
        institucionProcedencia: Escuela Secundaria Nº 42
    UserUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        apellidoNombre: { type: string, maxLength: 255 }
        dni: { type: string, pattern: '^\\d{7,8}$' }
        email: { type: string, format: email }
        fechaNacimiento: { type: string, format: date }
        telefono: { type: string, pattern: '^\\d{10,11}$' }
        cuil: { type: string, pattern: '^\\d{11}$' }
        contactoEmergencia: { type: string, nullable: true }
        foto: { type: string, nullable: true }
        alumno: { $ref: '#/components/schemas/AlumnoProfileUpdate' }
    OwnProfileUpdateRequest:
      type: object
      description: Allowlist del perfil propio. No admite rol, estado ni secretos.
      additionalProperties: false
      properties:
        apellidoNombre: { type: string, maxLength: 255 }
        dni: { type: string, pattern: '^\\d{7,8}$' }
        email: { type: string, format: email, maxLength: 255 }
        fechaNacimiento: { type: string, format: date }
        telefono: { type: string, pattern: '^\\d{10,11}$' }
        cuil: { type: string, pattern: '^\\d{11}$', nullable: true }
        contactoEmergencia: { type: string, nullable: true, maxLength: 255 }
        foto: { type: string, nullable: true, maxLength: 255 }
    ChangeRoleRequest:
      type: object
      additionalProperties: false
      required: [rol]
      properties:
        rol: { type: string, enum: [ALUMNO, ADMINISTRATIVO, PROFESOR] }
        alumno:
          allOf:
            - $ref: '#/components/schemas/AlumnoProfileInput'
          description: Solo se admite con rol ALUMNO; es obligatorio si no existe una ficha preservada.
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8 }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 8 }
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    # -------- Carreras --------
    Career:
      type: object
      required: [id, nombre, duracionAnios, activo]
      properties:
        id: { type: integer }
        nombre: { type: string }
        duracionAnios: { type: integer }
        activo: { type: boolean }
    Subject:
      type: object
      required: [id, nombre, cargaHoraria, tipoEspacio, carrera, curso, activo]
      properties:
        id: { type: integer }
        nombre: { type: string }
        descripcion: { type: string, nullable: true }
        cargaHoraria: { type: integer }
        tipoEspacio: { $ref: '#/components/schemas/TipoEspacio' }
        carrera: { $ref: '#/components/schemas/Career' }
        curso:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            anio: { type: integer }
            descripcion: { type: string }
        activo: { type: boolean }
    Prerequisite:
      type: object
      required: [id, materiaOrigenId, materiaRequeridaId, materiaRequerida, tipoRequisito]
      properties:
        id: { type: integer }
        materiaOrigenId: { type: integer }
        materiaRequeridaId: { type: integer }
        materiaRequerida: { $ref: '#/components/schemas/Subject' }
        tipoRequisito: { type: string, enum: [OBLIGATORIA] }
        aplicaCursado: { type: boolean }
        aplicaRendir: { type: boolean }
    TeachingAssignment:
      type: object
      required: [id, profesorId, materiaId, profesor, fechaAsignacion, activo]
      properties:
        id: { type: integer }
        profesorId: { type: integer }
        materiaId: { type: integer }
        profesor: { $ref: '#/components/schemas/PublicUser' }
        fechaAsignacion: { type: string, format: date-time }
        fechaBaja: { type: string, format: date-time, nullable: true }
        activo: { type: boolean }
    Schedule:
      type: object
      required: [id, cursadaId, dia, horaInicio, horaFin, activo]
      properties:
        id: { type: integer }
        cursadaId: { type: integer }
        dia: { $ref: '#/components/schemas/DiaSemana' }
        horaInicio: { type: string, format: date-time, description: La interfaz edita HH:mm y lo convierte de forma estable al contrato ISO. }
        horaFin: { type: string, format: date-time }
        aula: { type: string, nullable: true }
        activo: { type: boolean }
    CourseOffering:
      type: object
      required: [id, materia, anioLectivo, periodo, horarios, activo]
      properties:
        id: { type: integer }
        materiaId: { type: integer }
        materia: { $ref: '#/components/schemas/Subject' }
        anioLectivo: { type: integer }
        periodo: { type: string, enum: [ANUAL, PRIMER_CUATRIMESTRE, SEGUNDO_CUATRIMESTRE] }
        docenteId: { type: integer, nullable: true }
        docente: { allOf: [{ $ref: '#/components/schemas/PublicUser' }], nullable: true }
        horarios:
          type: array
          items: { $ref: '#/components/schemas/Schedule' }
        activo: { type: boolean }
    EnrollmentPeriod:
      type: object
      required: [id, tipo, cicloLectivo, fechaInicio, fechaFin, materias, mesas, activo]
      properties:
        id: { type: integer }
        tipo: { $ref: '#/components/schemas/TipoPeriodo' }
        cicloLectivo: { type: integer }
        fechaInicio: { type: string, format: date-time }
        fechaFin: { type: string, format: date-time }
        materias:
          type: array
          items:
            type: object
            required: [materiaId, materia]
            properties:
              materiaId: { type: integer }
              materia: { $ref: '#/components/schemas/Subject' }
        mesas:
          type: array
          description: Mesas de períodos EXAMEN heredados, informativas en la consola de esta etapa.
          items: { type: object, additionalProperties: true }
        descripcion: { type: string, nullable: true }
        activo: { type: boolean }
    CarreraCreateRequest:
      type: object
      required: [nombre, duracionAnios]
      properties:
        nombre: { type: string, maxLength: 255 }
        duracionAnios: { type: integer, minimum: 1, maximum: 10 }
    CarreraUpdateRequest:
      type: object
      properties:
        nombre: { type: string, maxLength: 255 }
        duracionAnios: { type: integer, minimum: 1, maximum: 10 }
        activo: { type: boolean }

    # -------- Materias --------
    TipoEspacio:
      type: string
      enum: [MATERIA, SEMINARIO, TALLER, TALLER_PRACTICA]
    Modalidad:
      type: string
      enum: [PRESENCIAL, SEMIPRESENCIAL, LIBRE]
    PeriodoMateria:
      type: string
      enum: [ANUAL, PRIMER_CUATRIMESTRE, SEGUNDO_CUATRIMESTRE]
    Regimen:
      type: string
      enum: [REGULAR_PRESENCIAL_PROMOCION, REGULAR_PRESENCIAL_SIN_PROMOCION, REGULAR_SEMIPRESENCIAL, LIBRE]
    MateriaCreateRequest:
      type: object
      required: [nombre, cargaHoraria, tipoEspacio, carreraId]
      anyOf:
        - required: [cursoAnio]
        - required: [cursoId]
      properties:
        nombre: { type: string, maxLength: 255 }
        descripcion: { type: string, nullable: true }
        cargaHoraria: { type: integer, minimum: 1, maximum: 9999 }
        horasCatedra: { type: string, maxLength: 50, nullable: true }
        tipoEspacio: { $ref: '#/components/schemas/TipoEspacio' }
        modalidad: { $ref: '#/components/schemas/Modalidad', default: PRESENCIAL }
        periodo: { $ref: '#/components/schemas/PeriodoMateria', default: ANUAL }
        regimen: { $ref: '#/components/schemas/Regimen', default: REGULAR_PRESENCIAL_SIN_PROMOCION }
        notaMinima: { type: number, minimum: 0, maximum: 10, default: 6 }
        asistenciaRequerida: { type: number, minimum: 0, maximum: 100, default: 75 }
        tpRequeridos: { type: number, minimum: 0, maximum: 100, default: 75 }
        esPromocionable: { type: boolean, default: false }
        notaPromocion: { type: number, minimum: 0, maximum: 10, default: 8 }
        aniosRegularidad: { type: integer, minimum: 1, maximum: 5, default: 3 }
        carreraId: { type: integer, minimum: 1 }
        cursoAnio: { type: integer, minimum: 1, description: Año dentro de la duración de la carrera. Entrada preferida. }
        cursoId: { type: integer, nullable: true }
        espacioCurricularId: { type: integer, nullable: true }
    MateriaUpdateRequest:
      type: object
      properties:
        nombre: { type: string, maxLength: 255 }
        descripcion: { type: string, nullable: true }
        cargaHoraria: { type: integer, minimum: 1, maximum: 9999 }
        horasCatedra: { type: string, maxLength: 50, nullable: true }
        tipoEspacio: { $ref: '#/components/schemas/TipoEspacio' }
        modalidad: { $ref: '#/components/schemas/Modalidad' }
        periodo: { $ref: '#/components/schemas/PeriodoMateria' }
        regimen: { $ref: '#/components/schemas/Regimen' }
        notaMinima: { type: number, minimum: 0, maximum: 10 }
        asistenciaRequerida: { type: number, minimum: 0, maximum: 100 }
        tpRequeridos: { type: number, minimum: 0, maximum: 100 }
        esPromocionable: { type: boolean }
        notaPromocion: { type: number, minimum: 0, maximum: 10 }
        aniosRegularidad: { type: integer, minimum: 1, maximum: 5 }
        carreraId: { type: integer, minimum: 1 }
        cursoAnio: { type: integer, minimum: 1, description: Entrada preferida; el backend resuelve o crea un curso compatible. }
        cursoId: { type: integer, nullable: true }
        espacioCurricularId: { type: integer, nullable: true }
        activo: { type: boolean }
    CorrelatividadRequest:
      type: object
      required: [materiaRequeridaId, tipoRequisito]
      additionalProperties: false
      properties:
        materiaRequeridaId: { type: integer, minimum: 1 }
        tipoRequisito: { type: string, enum: [OBLIGATORIA] }
        aplicaCursado: { type: boolean, default: true }
        aplicaRendir: { type: boolean, default: true }

    # -------- Inscripciones --------
    InscripcionCarreraRequest:
      type: object
      required: [alumnoId, carreraId]
      properties:
        alumnoId: { type: integer, description: Alumno que el administrativo inscribe }
        carreraId: { type: integer }
        cicloLectivo: { type: integer, default: 2026 }
      example:
        alumnoId: 3
        carreraId: 1
        cicloLectivo: 2026
    InscripcionMateriaRequest:
      type: object
      required: [materiaId]
      properties:
        alumnoId: { type: integer, description: Solo para ADMINISTRATIVO; es Usuario.idUsuario y ALUMNO debe omitirlo. }
        materiaId: { type: integer }
        cicloLectivo: { type: integer, default: 2026 }
        modalidadElegida: { $ref: '#/components/schemas/Modalidad' }
      example:
        alumnoId: 3
        materiaId: 1
        cicloLectivo: 2026
    CambiarModalidadRequest:
      type: object
      required: [modalidadElegida]
      properties:
        modalidadElegida: { $ref: '#/components/schemas/Modalidad' }
    MateriaDisponibleAlumno:
      type: object
      required: [id, nombre, carrera, yaInscripto, yaAprobada, cumpleCorrelativas, correlativasPendientes, carreras]
      properties:
        id: { type: integer }
        nombre: { type: string }
        carrera: { $ref: '#/components/schemas/Career' }
        curso: { type: object, nullable: true, properties: { id: { type: integer }, anio: { type: integer } } }
        cursadas: { type: array, description: Cursadas activas sin horarios estructurados, items: { type: object, properties: { id: { type: integer }, anioLectivo: { type: integer } } } }
        modalidad: { $ref: '#/components/schemas/Modalidad', nullable: true, description: Modalidad propia de la materia disponible. }
        yaInscripto: { type: boolean }
        yaAprobada: { type: boolean }
        cumpleCorrelativas: { type: boolean }
        correlativasPendientes: { type: array, items: { type: object, properties: { id: { type: integer }, nombre: { type: string } } } }
        carreras: { type: array, items: { $ref: '#/components/schemas/Career' } }
        habilitada: { type: boolean, description: Resultado informativo; el alta revalida en backend. }
    MateriasDisponiblesResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { type: array, items: { $ref: '#/components/schemas/MateriaDisponibleAlumno' } }
    VerificacionInscripcionMateriaResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [puedeInscribirse, materia]
          properties:
            puedeInscribirse: { type: boolean }
            materia: { $ref: '#/components/schemas/MateriaDisponibleAlumno' }
    InscripcionMateriaAlumno:
      type: object
      properties:
        id: { type: integer }
        materiaId: { type: integer }
        alumnoId: { type: integer, description: Identificador interno Alumno.idAlumno en respuestas persistidas. }
        cicloLectivo: { type: integer }
        modalidadElegida: { $ref: '#/components/schemas/Modalidad' }
        estado: { type: string, enum: [ACTIVA, RECURSANDO, BAJA] }
        fechaInscripcion: { type: string, format: date-time }
        fechaBaja: { type: string, format: date-time, nullable: true }
        materia: { $ref: '#/components/schemas/Subject' }
    InscripcionMateriaMutationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [success, message, data]
          properties:
            data: { $ref: '#/components/schemas/InscripcionMateriaAlumno' }
    InscripcionesMateriaResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success: { type: boolean }
        data: { type: array, items: { $ref: '#/components/schemas/InscripcionMateriaAlumno' } }
        pagination:
          type: object
          required: [page, limit, total, totalPages]
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }
    HistorialInscripcionMateriaResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        data: { type: array, items: { $ref: '#/components/schemas/InscripcionMateriaAlumno' } }
    InscripcionCarreraAlumno:
      type: object
      properties:
        id: { type: integer }
        usuarioId: { type: integer, description: Usuario.idUsuario }
        carreraId: { type: integer }
        cicloLectivo: { type: integer }
        activo: { type: boolean }
        fechaBaja: { type: string, format: date-time, nullable: true }
        carrera: { $ref: '#/components/schemas/Career' }
    InscripcionesCarreraResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        data: { type: array, items: { $ref: '#/components/schemas/InscripcionCarreraAlumno' } }
    InscripcionExamenAlumno:
      type: object
      properties:
        id: { type: integer }
        mesaId: { type: integer }
        alumnoId: { type: integer, description: Identificador interno Alumno.idAlumno en respuestas persistidas. }
        condicion: { type: string, enum: [REGULAR, LIBRE] }
        fechaInscripcion: { type: string, format: date-time }
        fechaBaja: { type: string, format: date-time, nullable: true }
        mesa: { type: object, properties: { id: { type: integer }, fecha: { type: string, format: date-time }, materia: { $ref: '#/components/schemas/Subject' } } }
    InscripcionExamenMutationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [success, message, data]
          properties:
            data: { $ref: '#/components/schemas/InscripcionExamenAlumno' }
    InscripcionesExamenResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        data: { type: array, items: { $ref: '#/components/schemas/InscripcionExamenAlumno' } }
    TrayectoriaMateria:
      type: object
      properties:
        materia: { $ref: '#/components/schemas/Subject' }
        estado: { type: string, enum: [PENDIENTE, EN_CURSO, LIBRE, REGULAR, HABILITADO_PROMOCION, PROMOCIONADO, APROBADA, HOMOLOGADA] }
        plan: { type: object, properties: { cursoId: { type: integer, nullable: true }, anio: { type: integer, nullable: true }, posicion: { type: integer } } }
        inscripcion: { type: object, nullable: true, additionalProperties: true }
        cursadas: { type: array, items: { $ref: '#/components/schemas/InscripcionMateriaAlumno' } }
        asistencia: { type: object, nullable: true, additionalProperties: true }
        tps: { type: object, nullable: true, additionalProperties: true }
        parcialesEfectivos: { type: array, items: { type: object, additionalProperties: true } }
        regularidad: { type: object, nullable: true, additionalProperties: true }
        promocionDirecta: { type: object, nullable: true, additionalProperties: true }
        examenFinal: { type: object, nullable: true, additionalProperties: true }
        homologacion: { type: object, nullable: true, additionalProperties: true }
        definitiva: { type: object, nullable: true, additionalProperties: true }
    TrayectoriaAcademicaResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        data:
          type: object
          required: [alumnoUsuarioId, carrera, materias]
          properties:
            alumnoUsuarioId: { type: integer, description: Usuario.idUsuario }
            carrera: { $ref: '#/components/schemas/Career' }
            materias: { type: array, items: { $ref: '#/components/schemas/TrayectoriaMateria' } }
    EstadoAcademicoAlumnoResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        data:
          type: object
          required: [alumnoUsuarioId, materias]
          properties:
            alumnoUsuarioId: { type: integer, description: Usuario.idUsuario }
            materias:
              type: array
              items:
                type: object
                required: [materia, cicloLectivo, modalidadElegida, estado]
                properties:
                  materia: { type: object, required: [id, nombre], properties: { id: { type: integer }, nombre: { type: string } } }
                  cicloLectivo: { type: integer }
                  modalidadElegida: { $ref: '#/components/schemas/Modalidad' }
                  estado: { type: string, enum: [EN_CURSO, LIBRE, REGULAR, HABILITADO_PROMOCION, PROMOCIONADO] }
    HorarioPublicado:
      type: object
      required: [id, cicloLectivo, titulo, nombreOriginal, tamanio, fechaPublicacion, vigente]
      properties:
        id: { type: integer }
        cicloLectivo: { type: integer }
        titulo: { type: string }
        nombreOriginal: { type: string }
        tamanio: { type: integer }
        fechaPublicacion: { type: string, format: date-time }
        vigente: { type: boolean }
        publicadoPor: { type: object, nullable: true, properties: { id: { type: integer }, nombre: { type: string } } }
    HorarioPublicadoResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/HorarioPublicado' }
    HistorialHorarioPublicadoResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        data: { type: array, items: { $ref: '#/components/schemas/HorarioPublicado' } }
    HorarioPublicadoMutationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [success, message, data]
          properties:
            data: { $ref: '#/components/schemas/HorarioPublicado' }

    # -------- Exámenes --------
    TipoExamen:
      type: string
      enum: [ORAL, ESCRITO]
    EstadoMesa:
      type: string
      enum: [ABIERTA, EN_PROCESO, FINALIZADA]
    MesaDisponibleAlumno:
      type: object
      required: [id, materia, fecha, tipoExamen, llamado, tribunal, condicion, inscripto]
      properties:
        id: { type: integer, minimum: 1 }
        materia:
          type: object
          required: [id, nombre, carrera]
          properties:
            id: { type: integer, minimum: 1 }
            nombre: { type: string }
            carrera:
              type: object
              required: [id, nombre]
              properties:
                id: { type: integer, minimum: 1 }
                nombre: { type: string }
        fecha: { type: string, format: date-time }
        tipoExamen: { $ref: '#/components/schemas/TipoExamen' }
        llamado: { type: integer, minimum: 1 }
        tribunal:
          type: array
          items:
            type: object
            required: [profesorId, apellidoNombre, rolTribunal]
            properties:
              profesorId: { type: integer, minimum: 1 }
              apellidoNombre: { type: string }
              rolTribunal: { type: string, enum: [PRESIDENTE, VOCAL, SUPLENTE] }
        condicion: { type: string, enum: [REGULAR, LIBRE] }
        inscripto: { type: boolean }
    ExamenCreateRequest:
      type: object
      required: [materiaId, fecha, tipoExamen]
      properties:
        materiaId: { type: integer }
        fecha: { type: string, format: date-time }
        tipoExamen: { $ref: '#/components/schemas/TipoExamen' }
        llamado: { type: integer, default: 1 }
        folioExamen: { type: string, maxLength: 255, nullable: true }
        libroExamen: { type: string, maxLength: 255, nullable: true }
    ExamenUpdateRequest:
      type: object
      properties:
        materiaId: { type: integer }
        fecha: { type: string, format: date-time }
        tipoExamen: { $ref: '#/components/schemas/TipoExamen' }
        llamado: { type: integer }
        folioExamen: { type: string, maxLength: 255, nullable: true }
        libroExamen: { type: string, maxLength: 255, nullable: true }
        estadoMesa: { $ref: '#/components/schemas/EstadoMesa' }
        activo: { type: boolean }
    TribunalRequest:
      type: object
      required: [mesaId, profesorId]
      properties:
        mesaId: { type: integer, description: Identificador de la mesa de examen. }
        profesorId: { type: integer }
        rolTribunal: { type: string, enum: [PRESIDENTE, VOCAL, SUPLENTE], default: VOCAL }
    InscripcionExamenRequest:
      type: object
      properties:
        alumnoId: { type: integer, description: Solo para ADMINISTRATIVO; es Usuario.idUsuario y ALUMNO debe omitirlo. }
        condicion: { type: string, enum: [REGULAR, LIBRE], default: REGULAR }
    DesinscripcionExamenRequest:
      type: object
      properties:
        alumnoId: { type: integer, description: Solo para ADMINISTRATIVO; es Usuario.idUsuario y ALUMNO debe omitirlo. }
    CalificacionRequest:
      type: object
      required: [alumnoId, nota]
      properties:
        alumnoId: { type: integer }
        nota: { type: number, minimum: 1, maximum: 10 }

    # -------- Horarios --------
    DiaSemana:
      type: string
      enum: [LUNES, MARTES, MIERCOLES, JUEVES, VIERNES, SABADO, DOMINGO]
    HorarioRequest:
      type: object
      required: [cursadaId, dia, horaInicio, horaFin]
      properties:
        cursadaId: { type: integer }
        dia: { $ref: '#/components/schemas/DiaSemana' }
        horaInicio: { type: string, format: date-time, description: "ISO, p.ej. 2026-01-01T08:00:00.000Z" }
        horaFin: { type: string, format: date-time }
        aula: { type: string, maxLength: 50, nullable: true }
    HorarioUpdateRequest:
      type: object
      properties:
        cursadaId: { type: integer }
        dia: { $ref: '#/components/schemas/DiaSemana' }
        horaInicio: { type: string, format: date-time }
        horaFin: { type: string, format: date-time }
        aula: { type: string, maxLength: 50, nullable: true }
        activo: { type: boolean }

    # -------- Cursadas --------
    CursadaRequest:
      type: object
      required: [materiaId, anioLectivo]
      properties:
        materiaId: { type: integer, minimum: 1 }
        anioLectivo: { type: integer, minimum: 2000, maximum: 2100 }
        periodo:
          type: string
          enum: [ANUAL, PRIMER_CUATRIMESTRE, SEGUNDO_CUATRIMESTRE]
          default: ANUAL
        docenteId: { type: integer, minimum: 1, nullable: true }
      example:
        materiaId: 1
        anioLectivo: 2026
        periodo: ANUAL
        docenteId: 2
    CursadaUpdateRequest:
      type: object
      properties:
        materiaId: { type: integer, minimum: 1 }
        anioLectivo: { type: integer, minimum: 2000, maximum: 2100 }
        periodo:
          type: string
          enum: [ANUAL, PRIMER_CUATRIMESTRE, SEGUNDO_CUATRIMESTRE]
        docenteId: { type: integer, minimum: 1, nullable: true }
        activo: { type: boolean }
      example:
        periodo: PRIMER_CUATRIMESTRE
        activo: true

    # -------- Períodos de inscripción --------
    TipoPeriodo:
      type: string
      enum: [MATERIA, EXAMEN]
    LibroDeTemaCreateRequest:
      type: object
      required: [materiaId, fecha, temaDesarrollado]
      properties:
        materiaId: { type: integer, minimum: 1 }
        fecha: { type: string, format: date }
        temaDesarrollado: { type: string }
        observaciones: { type: string, nullable: true }
      example:
        materiaId: 1
        fecha: 2026-08-19
        temaDesarrollado: Unidad 1 - Introducción a la materia
        observaciones: Clase dictada en el aula 12
    LibroDeTemaUpdateRequest:
      type: object
      properties:
        fecha: { type: string, format: date }
        temaDesarrollado: { type: string }
        observaciones: { type: string, nullable: true }
      example:
        temaDesarrollado: Unidad 1 - Introducción (actualizado)
        observaciones: Consigna de trabajo práctico
    PeriodoRequest:
      type: object
      required: [tipo, cicloLectivo, fechaInicio, fechaFin]
      properties:
        tipo: { $ref: '#/components/schemas/TipoPeriodo' }
        cicloLectivo: { type: integer, minimum: 2000, maximum: 2100 }
        fechaInicio: { type: string, format: date-time }
        fechaFin: { type: string, format: date-time }
        materiasIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        mesasIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        descripcion: { type: string, maxLength: 255, nullable: true }
    PeriodoUpdateRequest:
      type: object
      properties:
        tipo: { $ref: '#/components/schemas/TipoPeriodo' }
        cicloLectivo: { type: integer, minimum: 2000, maximum: 2100 }
        fechaInicio: { type: string, format: date-time }
        fechaFin: { type: string, format: date-time }
        materiasIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        mesasIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        descripcion: { type: string, maxLength: 255, nullable: true }
        activo: { type: boolean }

    CargaAsistenciaRequest:
      type: object
      required: [cursadaId, fecha, asistencias]
      properties:
        cursadaId: { type: integer, minimum: 1 }
        fecha: { type: string, format: date }
        asistencias:
          type: array
          minItems: 1
          items:
            type: object
            required: [alumnoId, presente]
            properties:
              alumnoId: { type: integer, minimum: 1 }
              presente: { type: boolean }
              justificado: { type: boolean, default: false }
              observacion: { type: string, nullable: true }

    CursadaDisponibleCalificaciones:
      type: object
      required: [cursadaId, anioLectivo, materia]
      properties:
        cursadaId: { type: integer, minimum: 1 }
        anioLectivo: { type: integer }
        materia:
          type: object
          required: [id, nombre]
          properties:
            id: { type: integer, minimum: 1 }
            nombre: { type: string }

    CargaCalificacionesRequest:
      type: object
      required: [cursadaId, calificaciones]
      properties:
        cursadaId: { type: integer, minimum: 1 }
        calificaciones:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: object
                required: [alumnoId, tipoCalificacion, nota, fechaEvaluacion]
                properties:
                  alumnoId: { type: integer, minimum: 1 }
                  tipoCalificacion: { type: string, enum: [PARCIAL] }
                  numero: { type: integer, minimum: 1, default: 1 }
                  nota: { type: integer, minimum: 0, maximum: 10 }
                  fechaEvaluacion: { type: string, format: date }
                  observacion: { type: string, nullable: true }
              - type: object
                required: [alumnoId, tipoCalificacion, nota, parcialOriginalId]
                properties:
                  alumnoId: { type: integer, minimum: 1 }
                  tipoCalificacion: { type: string, enum: [RECUPERATORIO] }
                  numero: { type: integer, minimum: 1, description: Se ignora; se deriva del parcial original }
                  nota: { type: integer, minimum: 0, maximum: 10 }
                  fechaEvaluacion: { type: string, format: date, description: Opcional; fecha del recuperatorio sin hora }
                  parcialOriginalId: { type: integer, minimum: 1 }
                  observacion: { type: string, nullable: true }
              - type: object
                required: [alumnoId, tipoCalificacion, nota]
                properties:
                  alumnoId: { type: integer, minimum: 1 }
                  tipoCalificacion: { type: string, enum: [TRABAJO_PRACTICO, EXAMEN_FINAL] }
                  numero: { type: integer, minimum: 1, default: 1 }
                  nota: { type: integer, minimum: 0, maximum: 10 }
                  fechaEvaluacion: { type: string, format: date }
                  observacion: { type: string, nullable: true }

    HomologacionRequest:
      type: object
      required: [alumnoId, materiaId, tipoHomologacion, calificacion]
      properties:
        alumnoId: { type: integer, minimum: 1 }
        materiaId: { type: integer, minimum: 1 }
        tipoHomologacion: { type: string, enum: [TOTAL, PARCIAL] }
        calificacion: { type: number, minimum: 0, maximum: 10 }
        observacion: { type: string, maxLength: 2000, nullable: true }
