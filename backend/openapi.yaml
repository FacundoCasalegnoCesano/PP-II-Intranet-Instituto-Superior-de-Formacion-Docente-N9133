      responses:
        '200': { $ref: '#/components/responses/OK' }

  # ========================= PERÍODOS DE INSCRIPCIÓN =========================
  /periodos-inscripcion:
    get:
      tags: [Períodos de Inscripción]
      summary: Listar períodos de inscripción (todos los roles)
      parameters:
        - { name: tipo, in: query, schema: { $ref: '#/components/schemas/TipoPeriodo' } }
        - { name: activo, in: query, schema: { type: boolean } }
        - { name: cicloLectivo, in: query, schema: { type: integer, minimum: 2000, maximum: 2100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { $ref: '#/components/responses/OK' }
    post:
      tags: [Períodos de Inscripción]
      summary: Crear período de inscripción (solo admin)
      x-roles: [ADMINISTRATIVO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeriodoRequest' }
      responses:
        '201': { $ref: '#/components/responses/Created' }

  /periodos-inscripcion/activos/{tipo}:
    get:
      tags: [Períodos de Inscripción]
      summary: Períodos activos de un tipo (MATERIA o EXAMEN)
      parameters:
        - { name: tipo, in: path, required: true, schema: { $ref: '#/components/schemas/TipoPeriodo' } }
      responses:
        '200': { $ref: '#/components/responses/OK' }

  /periodos-inscripcion/verificar/{tipo}:
    get:
      tags: [Períodos de Inscripción]
      summary: Verificar si la inscripción de un tipo está habilitada
      parameters:
        - { name: tipo, in: path, required: true, schema: { $ref: '#/components/schemas/TipoPeriodo' } }
      responses:
        '200': { $ref: '#/components/responses/OK' }

  /periodos-inscripcion/{id}:
    get:
      tags: [Períodos de Inscripción]
      summary: Obtener período por ID (admin o profesor)
      x-roles: [ADMINISTRATIVO, PROFESOR]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OK' }
    put:
      tags: [Períodos de Inscripción]
      summary: Actualizar período (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeriodoUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/OK' }
    delete:
      tags: [Períodos de Inscripción]
      summary: Eliminar período (solo admin)
      x-roles: [ADMINISTRATIVO]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OK' }

  # ========================= HEALTH / RAÍZ =========================
