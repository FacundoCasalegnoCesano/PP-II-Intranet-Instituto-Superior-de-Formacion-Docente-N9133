      responses:
        '200':
          description: Servicio OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: OK }
                  timestamp: { type: string, format: date-time }
                  uptime: { type: number }

  /:
    get:
      tags: [Health]
      summary: Listado de recursos de la API (público)
      security: []
      responses:
        '200':
          description: Índice de endpoints
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }

  /auth/admin/backup-code:
